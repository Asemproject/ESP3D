name: Build ESP3D Firmware

on:
  push:
    branches: [ "3.0" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Override platformio.ini
        run: |
          python3 -c "
          content = open('platformio.ini').read()
          content = content.replace(
            'https://github.com/pioarduino/platform-espressif32/releases/download/51.03.04/platform-espressif32.zip',
            'espressif32@6.3.2'
          )
          content = content.replace(
            'board_build.partitions = min_spiffs.csv',
            'board_build.partitions = huge_app.csv'
          )
          open('platformio.ini', 'w').write(content)
          print(open('platformio.ini').read())
          "

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Patch SDIO_BIT_MODE
        run: |
          sed -i 's/SDIO_BIT_MODE/SD_ONE_BIT_MODE/g' \
            esp3d/src/core/commands/ESP420.cpp

      - name: Build Firmware ESP32
        run: pio run -e esp32dev

      - name: Collect bin files
        run: |
          mkdir -p firmware_output
          find $GITHUB_WORKSPACE -name "*.bin" -exec cp {} firmware_output/ \;
          ls -la firmware_output/

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: firmware_output/
          if-no-files-found: error
          retention-days: 30

steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af 2>/dev/null || true
          df -h

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Override platform in platformio.ini   # <-- DISINI
        run: |
          python3 - << 'PYEOF'
          content = """;This file was generated by ESP3D-Configurator V1.0.0-a34
          [platformio]
          src_dir     = esp3d
          build_dir   = .pioenvs
          lib_dir     = libraries
          libdeps_dir = .piolibdeps
          data_dir = esp3d/data
          default_envs = esp32dev

          [env:esp32dev]
          platform = espressif32@6.3.2
          board = esp32dev
          framework = arduino
          monitor_speed = 115200
          monitor_echo = yes
          monitor_filters = send_on_enter, colorize, esp32_exception_decoder
          board_build.flash_mode = dio
          upload_speed = 460800
          extra_scripts = pre:platformIO/extra_script.py
          board_build.filesystem = fatfs
          board_upload.flash_size = 4MB
          board_build.partitions = huge_app.csv
          build_flags =
              -DSDIO_BIT_MODE=SD_ONE_BIT_MODE
              -Os
          """
          with open("platformio.ini", "w") as f:
              f.write(content)
          PYEOF

          echo "=== platformio.ini sekarang ==="
          cat platformio.ini

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Install PlatformIO
        run: pip install -U platformio

      - name: Patch SDIO_BIT_MODE
        run: |
          sed -i 's/SDIO_BIT_MODE/SD_ONE_BIT_MODE/g' \
            esp3d/src/core/commands/ESP420.cpp

      - name: Build Firmware ESP32
        run: pio run -e esp32dev

      - name: Collect bin files
        run: |
          mkdir -p firmware_output
          find $GITHUB_WORKSPACE -name "*.bin" -exec cp {} firmware_output/ \;
          ls -la firmware_output/

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: firmware_output/
          if-no-files-found: error
          retention-days: 30

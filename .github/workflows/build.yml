name: Build ESP3D Firmware

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:  # Bisa trigger manual

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: |
          pip install platformio

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      - name: Build Firmware ESP32
        run: |
          pio run -e esp32dev

      - name: Upload Firmware Artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: firmware_output/
          retention-days: 30

      - name: Collect and Upload all .bin files
        run: |
          mkdir -p firmware_output
          find $GITHUB_WORKSPACE -name "*.bin" 2>/dev/null -exec cp {} firmware_output/ \;
          echo "=== Files collected ==="
          ls -la firmware_output/

      - name: Upload all bin files
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: firmware_output/
          if-no-files-found: error
          retention-days: 30

- name: Override platform in platformio.ini
        run: |
          python3 - << 'PYEOF'
          content = """;This file was generated by ESP3D-Configurator V1.0.0-a34
          [platformio]
          src_dir     = esp3d
          build_dir   = .pioenvs
          lib_dir     = libraries
          libdeps_dir = .piolibdeps
          data_dir = esp3d/data
          default_envs = esp32dev

          [env:esp32dev]
          platform = espressif32@6.3.2
          board = esp32dev
          framework = arduino
          monitor_speed = 115200
          monitor_echo = yes
          monitor_filters = send_on_enter, colorize, esp32_exception_decoder
          board_build.flash_mode = dio
          upload_speed = 460800
          extra_scripts = pre:platformIO/extra_script.py
          board_build.filesystem = fatfs
          board_upload.flash_size = 4MB
          board_build.partitions = huge_app.csv
          build_flags =
              -DSDIO_BIT_MODE=SD_ONE_BIT_MODE
              -Os
          """
          with open("platformio.ini", "w") as f:
              f.write(content)
          print("Done writing platformio.ini")
          PYEOF

          echo "=== platformio.ini sekarang ==="
          cat platformio.ini
